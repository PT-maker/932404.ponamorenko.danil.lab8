<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Бронирование столиков в ресторане">
  <title>Бронирование столиков</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

  <header class="site-header">
    <h1>Бронирование столиков</h1>
    <p>Ресторан «Лаборатория»</p>
  </header>

  <main id="main">
    <div class="tabs" role="tablist" aria-label="Разделы приложения">
      <button type="button" role="tab" id="tab-list" class="tab" aria-selected="true" aria-controls="panel-list">Бронирования</button>
      <button type="button" role="tab" id="tab-form" class="tab" aria-selected="false" aria-controls="panel-form" tabindex="-1">Новая бронь</button>
    </div>

    <section id="panel-list" role="tabpanel" aria-labelledby="tab-list" tabindex="0">
      <form id="filters" class="filters" aria-label="Фильтры списка">
        <div class="field">
          <label for="filter-date">Дата</label>
          <input type="date" id="filter-date">
        </div>
        <div class="field">
          <label for="filter-status">Статус</label>
          <select id="filter-status">
            <option value="">Все</option>
            <option value="pending">Ожидает</option>
            <option value="confirmed">Подтверждена</option>
            <option value="cancelled">Отменена</option>
          </select>
        </div>
        <button type="button" class="btn" id="filters-reset">Сбросить</button>
      </form>

      <p id="list-summary" class="summary" aria-live="polite"></p>
      <ul id="reservations" class="cards"></ul>
      <p id="empty" class="empty" hidden>Бронирований не найдено</p>
    </section>

    <section id="panel-form" role="tabpanel" aria-labelledby="tab-form" tabindex="0" hidden>
      <h2 id="form-title">Новое бронирование</h2>

      <form id="reservation-form" class="form" novalidate>
        <div class="field">
          <label for="name">Имя гостя</label>
          <input type="text" id="name" maxlength="100" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="party-size">Количество гостей</label>
          <input type="number" id="party-size" min="1" max="20" value="2" inputmode="numeric" required>
        </div>

        <div class="field">
          <label for="date-time">Дата и время</label>
          <input type="datetime-local" id="date-time" required>
        </div>

        <div class="field" id="status-field" hidden>
          <label for="status">Статус</label>
          <select id="status">
            <option value="pending">Ожидает</option>
            <option value="confirmed">Подтверждена</option>
            <option value="cancelled">Отменена</option>
          </select>
        </div>

        <div class="occupancy">
          <div class="occupancy-head">
            <span id="occupancy-label">Занятость зала</span>
            <span id="occupancy-text" aria-live="polite">Выберите дату и время</span>
          </div>
          <div class="meter" id="meter" role="progressbar" aria-labelledby="occupancy-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="meter-fill" id="meter-fill"></div>
          </div>
          <p class="hint" id="occupancy-hint" aria-live="polite"></p>
        </div>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Забронировать</button>
          <button type="button" class="btn" id="cancel-edit" hidden>Отменить редактирование</button>
        </div>
      </form>
    </section>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text">
    <form method="dialog">
      <h2 id="dialog-title">Подтверждение</h2>
      <p id="dialog-text"></p>
      <div class="form-actions">
        <button type="submit" class="btn" value="cancel" autofocus>Назад</button>
        <button type="submit" class="btn btn-primary" id="dialog-ok" value="ok">Подтвердить</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
